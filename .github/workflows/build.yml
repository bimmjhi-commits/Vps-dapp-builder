name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
      app_url:
        description: 'URL Website'
        required: true
      package_name:
        description: 'Package'
        required: true
      version_name:
        description: 'Versi'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Ganti Data
        run: |
          sed -i "s|APP_URL_PLACEHOLDER|${{ inputs.app_url }}|g" app/src/main/java/com/dapp/webtoapk/MainActivity.kt
          sed -i "s|APP_NAME_PLACEHOLDER|${{ inputs.app_name }}|g" app/src/main/AndroidManifest.xml
      - name: Build
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
