name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name: {required: true, default: 'My App'}
      app_url: {required: true, default: 'https://google.com'}
      package_name: {required: true, default: 'com.example.app'}
      version_name: {required: true, default: '1.0'}
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/Android/Sdk
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {java-version: '17', distribution: 'temurin'}
      - name: Create Full Project
        run: |
          PKG="${{ inputs.package_name }}"
          URL="${{ inputs.app_url }}"
          P=$(echo $PKG | tr '.' '/')
          mkdir -p app/src/main/java/$P
          mkdir -p app/src/main/res/values
          echo "include ':app'" > settings.gradle
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath "com.android.tools.build:gradle:8.2.2" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<EOF
          apply plugin: 'com.android.application'
          android {
            namespace "$PKG"
            compileSdk 34
            defaultConfig {
              applicationId "$PKG"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "${{ inputs.version_name }}"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET"/>
          <application android:label="${{ inputs.app_name }}"
          android:theme="@style/Theme.AppCompat.Light">
          <activity android:name=".MainActivity" android:exported="true">
          <intent-filter><action android:name="android.intent.action.MAIN"/>
          <category android:name="android.intent.category.LAUNCHER"/>
          </intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/$P/MainActivity.java <<EOF
          package $PKG;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              setContentView(w);
              w.setWebViewClient(new WebViewClient());
              w.getSettings().setJavaScriptEnabled(true);
              w.loadUrl("$URL");
            }
          }
          EOF
          echo '<resources/>' > app/src/main/res/values/strings.xml
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true
      - run: gradle assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk app.apk
      - uses: actions/upload-artifact@v4
        with: {name: apk, path: '*.apk'}
