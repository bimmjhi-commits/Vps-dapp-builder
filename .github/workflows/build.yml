name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
        default: 'My App'
      app_url:
        required: true
        default: 'https://google.com'
      package_name:
        required: true
        default: 'com.example.app'
      version_name:
        required: true
        default: '1.0'
      icon_url:
        required: false
        default: ''
      fullscreen:
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Full Project
        run: |
          PKG="${{ inputs.package_name }}"
          URL="${{ inputs.app_url }}"
          P=$(echo $PKG | tr '.' '/')
          mkdir -p app/src/main/java/$P
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          echo "include ':app'" > settings.gradle
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # ICON - download dari icon_url
          if [ -n "${{ inputs.icon_url }}" ]; then
            curl -L "${{ inputs.icon_url }}" -o icon.png
            for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
              cp icon.png app/src/main/res/mipmap-$d/ic_launcher.png
            done
            ICON_LINE='android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
          else
            ICON_LINE=''
          fi

          # THEME - fullscreen atau tidak
          if [ "${{ inputs.fullscreen }}" = "true" ]; then
            THEME="@android:style/Theme.NoTitleBar.Fullscreen"
          else
            THEME="@android:style/Theme.Material.Light"
          fi

          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath "com.android.tools.build:gradle:8.2.2" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle <<EOF
          apply plugin: 'com.android.application'
          android {
            namespace "$PKG"
            compileSdk 34
            defaultConfig {
              applicationId "$PKG"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "${{ inputs.version_name }}"
            }
            buildTypes {
              release { minifyEnabled false }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
              android:label="${{ inputs.app_name }}"
              $ICON_LINE
              android:theme="$THEME"
              android:usesCleartextTraffic="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/$P/MainActivity.java <<EOF
          package $PKG;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            private WebView w;
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              requestWindowFeature(Window.FEATURE_NO_TITLE);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);
              s.setAllowFileAccess(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              w.setWebViewClient(new WebViewClient() {
                public boolean shouldOverrideUrlLoading(WebView v, String u) {
                  v.loadUrl(u);
                  return true;
                }
              });
              w.setWebChromeClient(new WebChromeClient());
              w.loadUrl("$URL");
            }
            public void onBackPressed() {
              if (w != null && w.canGoBack()) {
                w.goBack();
              } else {
                super.onBackPressed();
              }
            }
          }
          EOF

          echo '<resources/>' > app/src/main/res/values/strings.xml

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - run: gradle assembleDebug --stacktrace

      - run: cp app/build/outputs/apk/debug/app-debug.apk app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: '*.apk'
